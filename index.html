<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f1ec">
  <title>みんなで川をつくろう｜デジタルスタンプラリー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- スタンプのアイコン（線画）。スタンプ枠と川の図で共通に使います。 -->
<svg class="icon-defs" aria-hidden="true" focusable="false">
  <symbol id="icon-river" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17v-6a7 7 0 0 1 14 0v6"/><path d="M3 20.5c2-1.2 4-1.2 6 0s4 1.2 6 0 4-1.2 6 0"/></symbol>
  <symbol id="icon-bridge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8h20"/><path d="M4 8v9M20 8v9"/><path d="M4 15a8 5 0 0 1 16 0"/><path d="M3 20.5c2-1.2 4-1.2 6 0s4 1.2 6 0 4-1.2 6 0"/></symbol>
  <symbol id="icon-fish" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c2.5-4.2 8.5-6 14 0-5.5 6-11.5 4.2-14 0z"/><path d="M17 12l4-3.5v7z"/><circle cx="8" cy="11.2" r=".9" fill="currentColor" stroke="none"/></symbol>
  <symbol id="icon-island" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16.5c1.5-3.5 4-5 7-5s5.5 1.5 7 5"/><path d="M12 11.5V6"/><path d="M12 6c-1.6-1.5-3.5-1.6-5-.6M12 6c1.6-1.5 3.5-1.6 5-.6"/><path d="M3 19.5c2-1.2 4-1.2 6 0s4 1.2 6 0 4-1.2 6 0"/></symbol>
  <symbol id="icon-water" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5c3.2 4.2 5.5 7.2 5.5 10.3a5.5 5.5 0 0 1-11 0c0-3.1 2.3-6.1 5.5-10.3z"/><path d="M9.6 14.6a2.4 2.4 0 0 0 2.4 2.4"/></symbol>
  <symbol id="icon-goal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V3.5"/><path d="M6 4.5h11l-2.2 3.5 2.2 3.5H6"/></symbol>
</svg>

<header class="hero">
  <p class="eyebrow">IWAMOTOCHO CULVERT PROJECT</p>
  <h1><span class="ph">みんなで</span><span class="ph">川をつくろう</span></h1>
  <p class="lead"><span class="ph">QRコードを見つけて、</span><span class="ph">暗渠の「川」を</span><span class="ph">完成させよう。</span><br>
    （プロトタイプ）</p>
</header>

<main class="container">
  <!-- QRを読み取った結果（獲得・獲得済み・通信エラー・完成） -->
  <section id="scanResult" class="scan-result" role="status" aria-live="polite" hidden></section>

  <section class="card river-card">
    <div class="card-head">
      <h2>みんなでつくる川（仮）</h2>
      <p class="progress" aria-label="獲得したスタンプの数"><span id="count" class="count">0</span><span class="of">/</span><span id="total">6</span></p>
    </div>
    <div id="river" class="river"></div>
    <p id="riverMessage" class="river-message">QRコードを読み取って、川をつくろう。</p>
  </section>

  <a id="surveyLink" class="survey-link hidden" href="survey/">
    <span class="survey-link-title">アンケートに回答する</span>
    <span class="survey-link-sub">コンプリートした方へ。景品の応募もこちらから</span>
  </a>

  <section class="card">
    <div class="card-head"><h2>スタンプ</h2></div>
    <div id="stamps" class="stamps"></div>
  </section>

  <section class="card id-card">
    <div class="status-row">
      <span>参加者ID</span>
      <code id="participantId">読み込み中…</code>
    </div>
    <p class="small">このIDは端末ごとに自動発行されます。スタンプの取得では名前などの個人情報は収集しません。</p>
  </section>
</main>

<footer>Digital Stamp Rally Prototype</footer>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
