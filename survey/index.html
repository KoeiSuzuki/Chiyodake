<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>スタンプラリー アンケート</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script><script src="../js/config.js"></script></head><body>
<main class="container"><h1>スタンプラリー アンケート</h1><p id="lead">コンプリート状況を確認しています…</p>
<form id="surveyForm" hidden><label>参加者ID<input id="participantId" readonly></label>
<label>満足度（1〜5）<select id="satisfaction" required><option value="">選択してください</option><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label>
<label>印象に残ったスポット<select id="memorableSpot"><option value="">選択してください</option><option value="river">川の入口</option><option value="bridge">橋</option><option value="fish">魚</option><option value="island">島</option><option value="water">水辺</option><option value="goal">ゴール</option></select></label>
<label>自由記述<textarea id="comment" rows="5" maxlength="2000"></textarea></label>
<label class="check prize"><input id="prizeRequested" type="checkbox"> 景品を希望する</label>
<p class="note">希望する場合は、発送先の入力が必要です。希望しない場合、氏名・住所などの個人情報はお預かりしません。</p>
<fieldset id="shipping" hidden disabled><legend>景品発送情報</legend>
<label>氏名<input id="name" required maxlength="100" autocomplete="name"></label>
<label>郵便番号<input id="postal" required inputmode="numeric" autocomplete="postal-code" placeholder="例：101-0032"></label>
<label>住所<input id="address" required maxlength="300" autocomplete="street-address"></label>
<label>電話番号<input id="phone" type="tel" required autocomplete="tel" placeholder="例：090-1234-5678"></label>
<label class="check"><input id="consent" type="checkbox" required> 景品発送のために上記の情報を利用することに同意します。</label></fieldset>
<button type="submit" id="submitBtn">送信する</button></form><p id="message" role="status"></p>
<p><a href="../">スタンプラリーに戻る</a></p></main><script src="app.js"></script></body></html>
